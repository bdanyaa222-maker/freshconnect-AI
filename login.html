<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - FreshConnect AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    
    <!-- Minimal Navigation for Login Page -->
    <nav class="navbar navbar-expand-lg fixed-top glass-navbar py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-white fs-4 mx-auto mx-lg-0" href="index.html">
                <i class="fa-solid fa-graduation-cap text-gradient me-2"></i> FreshConnect AI
            </a>
            <div class="d-none d-lg-block ms-auto">
                <a href="index.html" class="btn btn-outline-light rounded-pill border-secondary"><i class="fa-solid fa-house me-2"></i>Back to Home</a>
            </div>
        </div>
    </nav>
<!-- Login Section -->
    <section class="flex-grow-1 d-flex align-items-center pt-5 mt-5">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5" data-aos="zoom-in" data-aos-duration="800">
                    <div class="glass-card p-5">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center bg-dark rounded-circle mb-3 border border-secondary" style="width: 80px; height: 80px;">
                                <i class="fa-solid fa-user-graduate fs-1 text-cyan"></i>
                            </div>
                            <h2 class="fw-bold text-white mb-1">Welcome Back</h2>
                            <p class="text-secondary small">Login to your digital campus portal</p>
                        </div>
                        <form id="login-form"></form>
                            <!-- Email Input -->
                            <div class="mb-3">
                                <label class="form-label text-white-50 small fw-bold">University Email / Roll No</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-envelope"></i></span>
                                                                        <input type="text" id="roll-no" class="form-control bg-dark border-secondary text-white" placeholder="e.g. 21X41A0501" required>
                                </div>
                            </div>
<!-- Password Input -->
                            <div class="mb-4">
                                <div class="d-flex justify-content-between">
                                    <label class="form-label text-white-50 small fw-bold">Password</label>
                                    <a href="#" class="text-cyan small text-decoration-none">Forgot Password?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="password" class="form-control bg-dark border-secondary text-white" placeholder="Enter your password" required>
                                </div>
                            </div>
                            <!-- Error Div -->
                            <div id="login-error" class="alert alert-danger" style="display:none; padding: 10px; font-size: 0.9rem;"></div>
                            <!-- Remember Me -->
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input bg-dark border-secondary" id="rememberMe">
                                <label class="form-check-label text-secondary small" for="rememberMe">Keep me logged in</label>
                            </div>
                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-5 mb-3">
                                <i class="fa-solid fa-right-to-bracket me-2"></i> Secure Login
                            </button>
                            <!-- Alternative Login -->
                            <div class="text-center mt-4 border-top border-secondary pt-3">
                                <p class="text-secondary small mb-3">Or login with</p>
                                <button type="button" class="btn btn-outline-light bg-dark border-secondary w-100 rounded-pill">
                                    <i class="fa-brands fa-google me-2 text-danger"></i> Google Workspace
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
     <!-- Chatbot Placeholder -->
    <div id="ai-chatbot-btn" onclick="toggleChat()"><i class="fa-solid fa-message"></i></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
